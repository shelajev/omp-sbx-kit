schemaVersion: "2"
kind: sandbox
name: omp
displayName: omp
description: >-
  Run the omp coding agent inside a Docker Sandbox, with OpenRouter as the
  default model provider and its API key injected by the host-side proxy.
sourceURL: https://github.com/unsigned-gg/omp
licenses:
  - Apache-2.0

sandbox:
  image: docker/sandbox-templates:shell-docker
  entrypoint: [omp, --model, openrouter/stealth/ox-alpha, --auto-approve]

agentInstructions:
  filename: AGENTS.md
  content: |
    ## omp sandbox

    You are running as omp inside a Docker Sandbox. The sandbox is the security
    boundary, so omp starts with tool approvals disabled. The workspace is the
    directory omp was launched in and sudo is passwordless.

    OpenRouter is the default model provider. `OPENROUTER_API_KEY` contains only
    a proxy sentinel; the real key remains on the host and is inserted into
    requests to `openrouter.ai`. Never persist or print the sentinel.

    Outbound networking is deny-by-default. The kit allows OMP package installs
    and OpenRouter API calls. If a task needs another package registry, source
    host, or external API, explain that its domain must be added to the kit or
    allowed with `sbx policy allow network <domain>`.

permissions:
  network:
    allow:
      - registry.npmjs.org
      - openrouter.ai

credentials:
  - service: openrouter
    description: OpenRouter API key (https://openrouter.ai/keys)
    required: true
    apiKey:
      name: OPENROUTER_API_KEY
      proxyManaged: true
      inject:
        - domain: openrouter.ai
          header: Authorization
          format: "Bearer %s"

environment:
  variables:
    OMP_SANDBOX: docker-sbx

setup:
  install:
    - command: |
        set -eu
        npm config set proxy "$HTTP_PROXY"
        npm config set https-proxy "$HTTPS_PROXY"
        npm install -g --no-fund --no-audit bun@1.3.14 @oh-my-pi/pi-coding-agent@18.0.4
        omp --version
      user: "1000"
      description: Install omp 18.0.4 from its official npm package
